# CI fast lane — docs/infra-plan.md Phase 3.
#
# All five jobs - `lint`, `sw`, `sim-unit`, `synth-coproc` and `sim-soc` -
# are real, blocking checks (required status checks on `main`); none is
# stubbed. `sim-unit` and `synth-coproc` graduated from stubs when the
# Keccak coprocessor RTL landed under hw/coproc/ (openspec change
# sha3-cvxif-coprocessor), `sim-soc` when the Verilator SoC flow passed its
# green light (openspec change graduate-sim-soc). A check added later before
# its real implementation can work follows the stub contract in
# openspec/specs/ci-pipeline/spec.md: it runs under its final name, names
# its blocker, exits 0, and is not required until a follow-up graduates it.
name: CI

on:
  # pull_request already fires on every push to a branch with an open PR,
  # so scoping push to main avoids running the whole workflow twice for
  # the common case (push to a branch that already has a PR open) -
  # found via two genuinely duplicate runs against the same commit.
  push:
    branches: [main]
  pull_request:

# GitHub Actions' default `run:` shell for a container job is plain `sh`
# (dash in newt-eda, since it's Ubuntu-based) unless told otherwise - not
# bash, even though bash is present in the image. Several steps below use
# bash-only syntax (`mapfile`, arrays, `<<<` here-strings); under dash
# those fail with a syntax error rather than just misbehaving. This went
# undetected through every prior test push because every one of them had
# zero changed `.sv` files, so the one step that actually hit this
# (verilator --lint-only) was always skipped - only surfaced on the first
# push that changed real RTL.
# Redirect buildroot's legacy git:// server to buildroot's own GitLab over
# HTTPS (change redirect-buildroot-to-https). Every dependency checkout clones
# Cheshire recursively, and its unused sw/deps/cva6-sdk pulls `buildroot` from
# git://git.buildroot.net. That server had full outages on 2026-10-06 and
# 2026-10-07 that failed every job. Git reads GIT_CONFIG_COUNT/KEY_n/VALUE_n as
# configuration, and bender shells out to git, so the rewrite reaches the nested
# submodule clone inside the job container. Same commit, different host. The
# durable fix (stop cloning cva6-sdk) is docs/infra-plan.md Phase 18.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: url.https://gitlab.com/buildroot.org/buildroot.git.insteadOf
  GIT_CONFIG_VALUE_0: git://git.buildroot.net/buildroot

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/wortexx/newt-eda:dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The container job's user doesn't own the runner-checked-out tree,
      # which makes git (and bender, which shells out to git) refuse to
      # touch it ("detected dubious ownership"). Confirmed necessary via a
      # local repro of the same failure mode in a container run.
      - name: Allow git to operate on the checked-out tree
        run: git config --global --add safe.directory '*'

      # Fail before any dependency checkout if the buildroot redirect in this
      # workflow's top-level env: is missing (redirect-buildroot-to-https D3).
      - name: Check the buildroot git URL redirect
        run: |
          url="$(git ls-remote --get-url git://git.buildroot.net/buildroot)"
          if [ "$url" != "https://gitlab.com/buildroot.org/buildroot.git" ]; then
            echo "::error::buildroot is not redirected to HTTPS (got $url) - see the GIT_CONFIG_* env block at the top of this workflow (change redirect-buildroot-to-https)"
            exit 1
          fi
          echo "buildroot redirected to $url"

      # bender has no `check` subcommand in any version (verified against
      # both the image's pinned 0.27.4 and a newer 0.32.0 - `bender check`
      # was a stale claim already sitting in docs/infra-plan.md's Phase 3
      # table before this change, never actually run against real bender).
      # `bender sources` is the closest real equivalent: it fully resolves
      # Bender.yml/Bender.lock and errors on a genuine inconsistency.
      #
      # Wrapped in a retry: a fresh `bender sources`/`bender checkout`
      # clones `cheshire`, which recursively clones ITS submodules,
      # including `sw/deps/cva6-sdk`'s own submodules. One of them
      # (buildroot, at the legacy `git://git.buildroot.net`) used to drop the
      # connection now and then, and on 2026-10-06/07 went down for hours,
      # which no retry survives. It is now redirected to HTTPS by the
      # GIT_CONFIG_* env block at the top of this file (change
      # redirect-buildroot-to-https). The retry stays, with a clean
      # `.bender/`, for transient faults on the remaining remotes.
      - name: bender sources (dependency graph resolves and is consistent)
        run: |
          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::giving up after $max attempts: $*"
                return 1
              fi
              echo "Attempt $attempt/$max failed - retrying with a clean .bender/ in 20s (see this step's header comment)."
              rm -rf .bender
              sleep 20
              attempt=$((attempt + 1))
            done
          }
          try() { bender sources > /dev/null; }
          retry try

      - name: Determine changed RTL files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            # `before` is all-zeros on a branch's first push - fall back
            # to the repo's root commit so the diff still resolves.
            if ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
            fi
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" "${{ github.sha }}" -- '*.sv' '*.svh' || true)
          echo "Base: $BASE"
          echo "Changed RTL files:"
          echo "${FILES:-<none>}"
          {
            echo "files<<EOF_FILES"
            echo "$FILES"
            echo "EOF_FILES"
          } >> "$GITHUB_OUTPUT"

      - name: verible-verilog-lint (changed files)
        if: steps.changed.outputs.files != ''
        run: |
          echo "${{ steps.changed.outputs.files }}" | xargs -r -n1 verible-verilog-lint

      - name: verilator --lint-only (changed files)
        if: steps.changed.outputs.files != ''
        run: |
          # Per-file, not full-elaboration: the full SoC is elaborated
          # separately by sim-soc's Verilator model build and is too slow
          # for a fast-lane check. Each file still needs the project's
          # include dirs/defines to resolve `include`s and package
          # typedefs, so pull those from the same bender-generated script
          # verilator.mk itself will eventually use, rather than hand
          # maintaining a second copy. A file that `import`s a package
          # (near-universal in this codebase) additionally needs that
          # package's own source compiled alongside it - an include path
          # alone does not resolve a SystemVerilog `import`, unlike
          # `` `include ``. Detect package files by content (`grep` for a
          # `package` declaration), not by a `*_pkg.sv` filename
          # convention - found via a real CI failure that a first,
          # filename-based version of this fix missed: upstream
          # cheshire's hw/future/spinal_usb_ohci.sv defines
          # spinal_usb_ohci_pkg without following that naming pattern.
          #
          # A changed file that instantiates other project modules (any
          # hierarchical wrapper, e.g. this DUT's own harness instantiating
          # iguana_soc) will always report MODMISSING for those instances
          # under a genuinely per-file check - passing every transitively
          # instantiated module's own file, and everything *they*
          # instantiate, is the full-elaboration file list this step
          # deliberately isn't running. -Wno-MODMISSING waives exactly
          # that expected condition; verified separately that it does not
          # mask a real syntax/type error in the file being linted.
          #
          # Also -Wno-fatal (matching verilator.mk's own established use of
          # it, for the same reason): without it, a pre-existing *warning*
          # in one of the upstream package files pulled in above for
          # import resolution - not the changed file itself - would fail
          # this job on every PR, since verilator treats any warning as
          # fatal by default. This only demotes warnings; genuine %Error
          # diagnostics (a real syntax/type error in the linted file
          # itself) stay fatal regardless.
          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::giving up after $max attempts: $*"
                return 1
              fi
              echo "Attempt $attempt/$max failed - retrying with a clean .bender/ in 20s (see the lint job's bender-sources step for why)."
              rm -rf .bender
              sleep 20
              attempt=$((attempt + 1))
            done
          }
          try() { bender script verilator -t rtl -t asic -t ihp13 -t cva6 -t cv64a6_imafdcsclic_sv39 > /tmp/verilator-flist.f; }
          retry try

          mapfile -t FLAGS < <(grep -E '^\+incdir|^\+define' /tmp/verilator-flist.f | sort -u)
          grep -v '^+' /tmp/verilator-flist.f > /tmp/verilator-files-only.f
          mapfile -t PKG_FILES < <(xargs -a /tmp/verilator-files-only.f grep -lE '^[[:space:]]*package[[:space:]]' 2>/dev/null | sort -u)

          status=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue # skip files deleted in this diff
            # The Xcelium lane's testbench drives Cheshire's VIP through
            # hierarchical task calls (fix.vip.jtag_init(), as tb_iguana
            # does); a dotted reference into a module outside the linted
            # file is a hard Verilator error no -Wno-* waives, and the VIP
            # (classes, DPI, vendor models) is not verilatable anyway.
            # Verible above still lints these files; Xcelium compiles them.
            case "$f" in
              target/xcelium/src/*)
                echo "skip (Xcelium-only testbench, see comment): $f"
                continue ;;
            esac
            PKG_ARGS=()
            for p in "${PKG_FILES[@]}"; do
              [ "$p" = "$f" ] && continue # don't pass the linted file twice if it's itself a package file
              PKG_ARGS+=("$p")
            done
            # Testbench packages are not in Bender.yml, so the list above
            # misses them (hw/coproc/tb/keccak_mmio_tb_pkg.sv, imported by
            # keccak_mmio_tb_top.sv). Also pass the package files that sit
            # next to the linted file, skipping any already in the list.
            for p in $(grep -lE '^[[:space:]]*package[[:space:]]' "$(dirname "$f")"/*.sv 2>/dev/null); do
              [ "$(realpath "$p")" = "$(realpath "$f")" ] && continue
              printf '%s\n' "${PKG_FILES[@]}" | xargs -r realpath | grep -qxF "$(realpath "$p")" && continue
              PKG_ARGS+=("$p")
            done
            # Elaborate only from the linted file's own modules (each one in
            # turn as --top-module), never from every module in the package
            # files above: a package file can also hold unrelated modules,
            # and without a top each of those becomes a lint root. Found when
            # Cheshire v0.3.1 brought iDMA 0.6, whose generated
            # idma_generated.sv mixes packages with ~50 REG_BUS-ported modules
            # (every hw/*.sv lint then failed on "Cannot find file containing
            # interface: 'REG_BUS'", and on Verilator UNSUPPORTED errors once
            # REG_BUS was supplied). A package-only file has no module to
            # start from, so it gets a throwaway top that imports its packages.
            mapfile -t TOPS < <(grep -oE '^[[:space:]]*module[[:space:]]+[A-Za-z_][A-Za-z_0-9$]*' "$f" | awk '{print $2}')
            EXTRA=()
            if [ "${#TOPS[@]}" -eq 0 ]; then
              {
                echo "module lint_wrap_top;"
                grep -oE '^[[:space:]]*package[[:space:]]+[A-Za-z_][A-Za-z_0-9$]*' "$f" | awk '{print "  import " $2 "::*;"}' || true
                echo "endmodule"
              } > /tmp/lint_wrap_top.sv
              TOPS=(lint_wrap_top)
              EXTRA=(/tmp/lint_wrap_top.sv)
            fi
            for top in "${TOPS[@]}"; do
              echo "::group::verilator --lint-only $f (top: $top)"
              verilator --lint-only -Wall -Wno-fatal -Wno-MODMISSING --top-module "$top" "${FLAGS[@]}" "${PKG_ARGS[@]}" "$f" "${EXTRA[@]}" || status=1
              echo "::endgroup::"
            done
          done <<< "${{ steps.changed.outputs.files }}"
          exit $status

  sw:
    runs-on: ubuntu-latest
    container: ghcr.io/wortexx/newt-eda:dev
    steps:
      - uses: actions/checkout@v7

      - name: Allow git to operate on the checked-out tree
        run: git config --global --add safe.directory '*'

      # Fail before any dependency checkout if the buildroot redirect in this
      # workflow's top-level env: is missing (redirect-buildroot-to-https D3).
      - name: Check the buildroot git URL redirect
        run: |
          url="$(git ls-remote --get-url git://git.buildroot.net/buildroot)"
          if [ "$url" != "https://gitlab.com/buildroot.org/buildroot.git" ]; then
            echo "::error::buildroot is not redirected to HTTPS (got $url) - see the GIT_CONFIG_* env block at the top of this workflow (change redirect-buildroot-to-https)"
            exit 1
          fi
          echo "buildroot redirected to $url"

      # Same retry rationale as lint's bender-sources step: `make
      # ig-sw-all` triggers the same fresh dependency checkout as a side
      # effect of Makefile parsing (buildroot is redirected; the retry is for
      # the other remotes).
      - name: Build test binaries (make ig-sw-all)
        run: |
          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::giving up after $max attempts: $*"
                return 1
              fi
              echo "Attempt $attempt/$max failed - retrying with a clean .bender/ in 20s (see the lint job's bender-sources step for why)."
              rm -rf .bender
              sleep 20
              attempt=$((attempt + 1))
            done
          }
          try() { make ig-sw-all; }
          retry try

  sim-unit:
    runs-on: ubuntu-latest
    container: ghcr.io/wortexx/newt-eda:dev
    steps:
      - uses: actions/checkout@v7

      - name: Allow git to operate on the checked-out tree
        run: git config --global --add safe.directory '*'

      # Fail before any dependency checkout if the buildroot redirect in this
      # workflow's top-level env: is missing (redirect-buildroot-to-https D3).
      - name: Check the buildroot git URL redirect
        run: |
          url="$(git ls-remote --get-url git://git.buildroot.net/buildroot)"
          if [ "$url" != "https://gitlab.com/buildroot.org/buildroot.git" ]; then
            echo "::error::buildroot is not redirected to HTTPS (got $url) - see the GIT_CONFIG_* env block at the top of this workflow (change redirect-buildroot-to-https)"
            exit 1
          fi
          echo "buildroot redirected to $url"

      - name: Coprocessor unit testbenches (make ig-coproc-unit)
        run: |
          # Verilator models of every hw/coproc block, each driven by a
          # self-checking C++ harness against the independent reference in
          # hw/coproc/tb/keccak_ref.h (hw/coproc/coproc.mk). Exits non-zero
          # on any mismatch, so a real regression fails the PR.
          #
          # ig-hw-cva6 first, so the CVA6 packages the CV-X-IF types come
          # from carry the SoC's configuration (scoreboard depth sets the
          # CV-X-IF id width). Same retry rationale as lint's bender-sources
          # step: the first make in a fresh workspace triggers the flaky
          # dependency checkout.
          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::giving up after $max attempts: $*"
                return 1
              fi
              echo "Attempt $attempt/$max failed - retrying with a clean .bender/ in 20s (see the lint job's bender-sources step for why)."
              rm -rf .bender
              sleep 20
              attempt=$((attempt + 1))
            done
          }
          try() { make ig-hw-cva6; }
          retry try
          make ig-coproc-unit

  # Boots the whole SoC in the Verilator model (target/verilator/) and runs
  # two programs: helloworld.spm (boot, JTAG preload, UART, exit-code path)
  # and sha3_smoke.spm (SHA3-256 KAT through both CV-X-IF ISE back-ends, so
  # CVA6 -> CV-X-IF -> keccak_cvxif end to end). Everything it runs is built
  # here from the PR's own sources, one step per stage, so a failure names
  # its stage. Only the dependency checkout is retried; a build or
  # simulation failure is a real failure (openspec change graduate-sim-soc,
  # design D1-D3).
  #
  # Each run's TIMEOUT_CYCLES is ~5x that program's measured cycle count,
  # so a hang fails the run step in minutes instead of reaching the job
  # timeout. Measured on ubuntu-latest (run 37451916162, 2026-10-06):
  # model build 191 s (Verilator walltime 190 s, 1 thread), helloworld
  # 216,760 cycles / 7 s, sha3_smoke 617,664 cycles / 20 s, job 8 min
  # (2 min of it container start, 2 min dependency checkout).
  sim-soc:
    runs-on: ubuntu-latest
    container: ghcr.io/wortexx/newt-eda:dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Allow git to operate on the checked-out tree
        run: git config --global --add safe.directory '*'

      # Fail before any dependency checkout if the buildroot redirect in this
      # workflow's top-level env: is missing (redirect-buildroot-to-https D3).
      - name: Check the buildroot git URL redirect
        run: |
          url="$(git ls-remote --get-url git://git.buildroot.net/buildroot)"
          if [ "$url" != "https://gitlab.com/buildroot.org/buildroot.git" ]; then
            echo "::error::buildroot is not redirected to HTTPS (got $url) - see the GIT_CONFIG_* env block at the top of this workflow (change redirect-buildroot-to-https)"
            exit 1
          fi
          echo "buildroot redirected to $url"

      # ig-hw-cva6 first: the model must simulate the SoC's CVA6
      # configuration, and verilator.mk refuses to build without it. Same
      # retry rationale as lint's bender-sources step: the first make in a
      # fresh workspace triggers the flaky dependency checkout.
      - name: Dependencies and CVA6 configuration (make ig-hw-cva6)
        run: |
          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::giving up after $max attempts: $*"
                return 1
              fi
              echo "Attempt $attempt/$max failed - retrying with a clean .bender/ in 20s (see the lint job's bender-sources step for why)."
              rm -rf .bender
              sleep 20
              attempt=$((attempt + 1))
            done
          }
          try() { make ig-hw-cva6; }
          retry try

      - name: Build test programs
        run: |
          chs=$(bender path cheshire)
          hello="$chs/sw/tests/helloworld.spm.elf"
          smoke="$PWD/sw/tests/sha3_smoke.spm.elf"
          make "$hello" "$smoke"
          echo "HELLO_ELF=$hello" >> "$GITHUB_ENV"
          echo "SMOKE_ELF=$smoke" >> "$GITHUB_ENV"

      - name: Build Verilator model (make ig-verilator-model)
        id: model
        run: make ig-verilator-model

      - name: Run helloworld.spm
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        run: make ig-sim-verilator BINARY="$HELLO_ELF" TIMEOUT_CYCLES=1200000

      - name: Run sha3_smoke.spm
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        run: make ig-sim-verilator BINARY="$SMOKE_ELF" TIMEOUT_CYCLES=3200000

  synth-coproc:
    runs-on: ubuntu-latest
    container: ghcr.io/wortexx/newt-eda:dev
    steps:
      - uses: actions/checkout@v7

      - name: Allow git to operate on the checked-out tree
        run: git config --global --add safe.directory '*'

      # Fail before any dependency checkout if the buildroot redirect in this
      # workflow's top-level env: is missing (redirect-buildroot-to-https D3).
      - name: Check the buildroot git URL redirect
        run: |
          url="$(git ls-remote --get-url git://git.buildroot.net/buildroot)"
          if [ "$url" != "https://gitlab.com/buildroot.org/buildroot.git" ]; then
            echo "::error::buildroot is not redirected to HTTPS (got $url) - see the GIT_CONFIG_* env block at the top of this workflow (change redirect-buildroot-to-https)"
            exit 1
          fi
          echo "buildroot redirected to $url"

      - name: Fetch the SG13G2 liberty files (sparse, pinned PDK submodule commit)
        run: |
          # The flow reads only the standard-cell and SRAM liberty files out
          # of the IHP-Open-PDK submodule. A full submodule clone is several
          # GB, so fetch exactly the commit the superproject pins, shallow and
          # blob-filtered, with only those two directories checked out.
          pdk=target/ihp13/pdk/ihp-sg13g2
          sha=$(git ls-tree HEAD "$pdk" | awk '{print $3}')
          url=$(git config -f .gitmodules --get submodule.target/ihp13/pdk.url)
          echo "PDK $url @ $sha"
          rm -rf "$pdk" && mkdir -p "$pdk"
          git -C "$pdk" init -q
          git -C "$pdk" remote add origin "$url"
          git -C "$pdk" sparse-checkout set --no-cone \
            /ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/ \
            /ihp-sg13g2/libs.ref/sg13g2_sram/lib/
          git -C "$pdk" fetch -q --depth 1 --filter=blob:none origin "$sha"
          git -C "$pdk" checkout -q FETCH_HEAD
          ls "$pdk"/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_typ_1p20V_25C.lib

      - name: Coprocessor block synthesis (make synth-coproc-all)
        run: |
          # Standalone synthesis of every hw/coproc block through the chip
          # flow's own yosys script and liberty, plus block STA at 11 ns
          # (target/ihp13/yosys/block-synth.mk). Fails on any synthesis
          # error or yosys CHECK problem. Same retry rationale as sim-unit
          # for the dependency checkout.
          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::giving up after $max attempts: $*"
                return 1
              fi
              echo "Attempt $attempt/$max failed - retrying with a clean .bender/ in 20s (see the lint job's bender-sources step for why)."
              rm -rf .bender
              sleep 20
              attempt=$((attempt + 1))
            done
          }
          try() { make ig-hw-cva6; }
          retry try
          make synth-coproc-all

      - name: Block metrics summary
        if: always()
        run: |
          shopt -s nullglob
          files=(target/ihp13/yosys/block/*/metrics.json)
          [ "${#files[@]}" -gt 0 ] || { echo "no metrics.json produced"; exit 0; }
          {
            echo "### Coprocessor block synthesis"
            echo
            echo '| block | R | cells | area (um^2) | DFFs | CHECK | slack @ 11 ns (ns) | reg-reg path (ns) |'
            echo '|---|---|---|---|---|---|---|---|'
            for f in "${files[@]}"; do
              python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print("| {block} | {rounds_per_cycle} | {cells} | {area_um2:.0f} | {dffs} | {check_problems} | {worst_slack_ns} | {critical_path_ns} |".format(**m))' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
