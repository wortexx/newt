# SCRATCH - branch drc-measure-scratch only, never merged.
# Measures the full-die minimal DRC (change seal-and-drc-gds task 3.4) on the
# lane's VM: stream + seal the routed DEF of run 45365266924, then one
# single-job run_drc.py with time and memory recorded. Dispatched with
# --ref drc-measure-scratch, so this file replaces the real lane for that run
# only. Same concurrency group, start and guarded stop as the real lane.
name: CI P&R Lane

on:
  workflow_dispatch:
    inputs:
      drc_jobs:
        description: 'DRC_JOBS (run_drc.py --mp)'
        required: false
        default: '1'

concurrency:
  group: pnr
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: newt-synth-lane-rg
  AZURE_VM_NAME: newt-synth-runner
  SOURCE_RUN: '45365266924'

jobs:
  start:
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Start VM (idempotent if already running)
        run: az vm start --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" --name "${{ env.AZURE_VM_NAME }}"

  drc:
    needs: start
    runs-on: [self-hosted, self-hosted-synth]
    container:
      image: ghcr.io/wortexx/newt-eda:dev
    permissions:
      contents: read
      actions: read
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Allow git to operate on the checked-out tree
        run: git config --global --add safe.directory '*'

      - name: PDK submodule (views for the stream)
        run: git submodule update --init --depth 1 target/ihp13/pdk/ihp-sg13g2

      - name: Download the routed DEF of the source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: basilisk-pnr-def
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: def

      # The published :dev predates docker/all/requirements.txt's klayout pin.
      - name: KLayout Python package
        run: |
          klayout -v
          python3 -c 'import klayout.db, sys; print("klayout.db", klayout.__version__)' 2>/dev/null \
            || pip3 install --break-system-packages klayout==0.30.5 \
            || pip3 install klayout==0.30.5
          python3 -c 'import klayout, yaml; print("klayout", klayout.__version__)'
          nproc; free -g

      - name: Stream + seal
        run: |
          DEF="$PWD/def/basilisk.final.def"
          ls -la "$DEF"
          time make -C target/ihp13/klayout -f klayout.mk gds GDS_DEF="$DEF" PROJ_NAME=basilisk | tail -30
          time make -C target/ihp13/klayout -f klayout.mk seal GDS_DEF="$DEF" PROJ_NAME=basilisk

      - name: Minimal DRC, measured
        env:
          DRC_JOBS: ${{ github.event.inputs.drc_jobs || '1' }}
        run: |
          out=target/ihp13/klayout/out
          mem="$out/drc-mem.log"
          # Memory trajectory: container cgroup current/peak and the largest
          # klayout RSS, once a minute.
          ( while sleep 60; do
              printf '%s current=%sMiB peak=%sMiB klayout_rss_max=%sMiB\n' "$(date -u +%FT%TZ)" \
                "$(( $(cat /sys/fs/cgroup/memory.current) / 1048576 ))" \
                "$(( $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0) / 1048576 ))" \
                "$(ps -C klayout -o rss= | sort -n | tail -1 | awk '{print int($1/1024)}')"
            done ) > "$mem" 2>&1 &
          sampler=$!
          SECONDS=0
          python3 -c 'import resource, subprocess, sys
          rc = subprocess.call(sys.argv[1:])
          print("max descendant RSS %d MiB" % (resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss // 1024))
          sys.exit(rc)' make -C target/ihp13/klayout -f klayout.mk drc DRC_JOBS="$DRC_JOBS" && rc=0 || rc=$?
          echo "make drc exit $rc after ${SECONDS}s, DRC_JOBS=$DRC_JOBS"
          kill $sampler || true
          echo "cgroup peak $(( $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0) / 1048576 )) MiB"
          tail -5 "$mem"
          exit $rc

      - name: Upload DRC measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drc-measure
          path: |
            target/ihp13/klayout/out/drc-minimal/
            target/ihp13/klayout/out/drc-mem.log
            target/ihp13/klayout/out/basilisk.seal.log
            target/ihp13/klayout/out/basilisk.stream.log
          retention-days: 14
          if-no-files-found: warn

  stop:
    needs: [drc]
    if: always()
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Check whether the runner is still needed
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh api "repos/${{ github.repository }}/actions/runners" --paginate \
            --jq '.runners[] | select(.labels[].name == "self-hosted-synth") | .busy' | grep -c true || true)
          synth_active=$(gh run list --repo "${{ github.repository }}" --workflow=synth.yml \
            --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          pnr_active=$(gh run list --repo "${{ github.repository }}" --workflow=pnr.yml \
            --json status,databaseId --jq "[.[] | select((.status == \"in_progress\" or .status == \"queued\") and .databaseId != ${{ github.run_id }})] | length")
          echo "runner busy=${busy:-0}, synth.yml active=${synth_active}, other pnr.yml active=${pnr_active}"
          if [ "${busy:-0}" -gt 0 ] || [ "${synth_active}" -gt 0 ] || [ "${pnr_active}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deallocate VM
        if: steps.guard.outputs.skip == 'false'
        run: az vm deallocate --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" --name "${{ env.AZURE_VM_NAME }}"
