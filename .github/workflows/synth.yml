# CI synth lane — docs/infra-plan.md Phase 4.
#
# Runs the full pickle-to-netlist yosys synthesis flow (`ig-hw-all` ->
# `pickle-all` -> `synth-all` -> `run-sta`), unlike ci.yml's fast lane which
# never touches synthesis. This is expensive (~2.5-3h, ~30GB RAM peak) so it
# does NOT run on every push/PR - see the `on:` triggers below. It fails only
# on a flow failure or a yosys CHECK problem; a metric drifting from the
# checked-in baseline is reported in the run summary, not a failure, and this
# job is NOT a required status check on `main` (see
# openspec/changes/ci-synth-lane/specs/ci-pipeline/spec.md for the full
# contract, and design.md for the decisions behind this file).
#
# Runner: `self-hosted-synth` (a manually provisioned Azure VM -
# Standard_E16ds_v5 / swedencentral - see design.md D1/D1a/D1b). This is a
# real scope change from the original plan: GitHub-hosted "larger runners"
# turned out to require a Team/Enterprise org plan, unavailable on this
# personal-account repo (task 1.1). Two consequences worth knowing before you
# touch this file:
#
#   1. VM lifecycle is now automatic, not manual (design.md D1a described the
#      original manual-stop/10:00-UTC-auto-shutdown state; Phase 6 landed the
#      Bicep-declared infra and OIDC login that superseded it). The VM is
#      deallocated by default, started by pnr.yml's `start` job (or by hand
#      for a synth-only session), and deallocated again either by pnr.yml's
#      own guarded `stop` job or by the hourly vm-watchdog.yml tick, whichever
#      notices first that nothing is running or queued. The fixed 10:00 UTC
#      auto-shutdown schedule (an undeclared Azure resource, not part of this
#      repo's templates) was deleted 2026-09-16 once both of those mechanisms
#      had been observed deallocating the VM for real
#      (openspec/changes/post-merge-ci-verification tasks 4.1/5.1) - there is
#      no longer any fixed-time backstop. Real on-demand cost is $1.216/hour
#      for the VM class alone (~$888/mo if it *were* left running 24/7 - it
#      deliberately isn't).
#      The practical upshot for the nightly cron trigger below, now that the
#      VM is deallocated by default rather than left running: [pending
#      openspec/changes/post-merge-ci-verification task 5.4's multi-night
#      observation as of 2026-09-17 - update this paragraph with what
#      actually happens to a 02:30 UTC run queued against a deallocated VM
#      once that's recorded]. `workflow_dispatch` and label-triggered runs are
#      unaffected either way (they queue for the runner regardless of the
#      VM's current power state, and a `pnr.yml` `start` job or a manual `az
#      vm start` brings it up for them).
#   2. This runner sits on a PUBLIC repo. A pull request from a fork must
#      never auto-execute here (see the `if:` condition on the `pull_request`
#      trigger below, plus the repo's "Require approval for all external
#      contributors" setting under Settings -> Actions -> General, both
#      required layers of design.md D1b's fork-PR gate).
name: CI Synth Lane

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC nightly; see note (1) above re: VM lifecycle
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          newt-eda tag to run the lane against. Defaults to `dev`, the tag
          `main` publishes. Set it to a PR's image (`pr-<number>`, pushed by
          docker-image.yml on pull-request runs) to run a tooling-bump
          adoption gate against that PR before merging it - see
          openspec/changes/upgrade-yosys-upstream design D5. Any tag other
          than `dev` also makes the netlist-naming check gating rather than
          advisory, since a gate run is exactly when a naming regression
          must block.
        required: false
        default: dev
        type: string
  pull_request:
    types: [labeled, synchronize, reopened]

# A superseded run of a ~3h job is pure wasted VM time (there's only one
# runner, so a second run just queues behind the first anyway) - cancel it.
# Nightly and PR refs land in separate concurrency groups so they never
# cancel each other.
concurrency:
  group: synth-${{ github.ref }}
  cancel-in-progress: true

# Same rationale as ci.yml: the container job's default `run:` shell is plain
# `sh`, not bash, and steps below use bash-only syntax.
defaults:
  run:
    shell: bash

jobs:
  synth:
    # Only run the pull_request trigger when: the PR carries `full-synth`,
    # AND its head is a branch of this repo, not a fork (design.md D1b layer
    # 2 - the repo's "require approval for external contributors" setting,
    # set by hand under Settings -> Actions -> General, is layer 1; a fork PR
    # is blocked by BOTH layers independently). schedule/workflow_dispatch
    # runs are unaffected by this condition (github.event.pull_request is
    # unset for those events).
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'full-synth') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, self-hosted-synth]
    # `inputs.image_tag` is set only on workflow_dispatch; schedule and
    # pull_request runs fall through to `dev`.
    container: ghcr.io/wortexx/newt-eda:${{ inputs.image_tag || 'dev' }}
    timeout-minutes: 350 # bounds a hung run so it doesn't tie up the one VM indefinitely
    steps:
      # This checkout's default `git clean -ffdx` wipes every untracked file
      # in the runner's single shared workspace, including anything the P&R
      # lane left in target/ihp13/openroad/. That is safe as of change
      # `pnr-checkpoints-outside-workspace`: pnr.yml's "Export checkpoints out
      # of the shared workspace" step moves its checkpoints to
      # /home/newt/pnr-export/<run_id> before its pnr job ends, so this clean
      # can no longer destroy a P&R run's pending upload (it did exactly that
      # to run 34783899813 on 2026-09-15). Manual out-of-band work on the
      # workspace is still unprotected - see docs/pnr-pipeline.md's Notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same fix as ci.yml: the container job's user doesn't own the
      # runner-checked-out tree, so git (and bender, which shells out to it)
      # refuses to touch it.
      - name: Allow git to operate on the checked-out tree
        run: git config --global --add safe.directory '*'

      # Same retry rationale as ci.yml's bender-sources step: a fresh
      # dependency checkout intermittently drops the buildroot.net submodule
      # clone. `ig-hw-all` is the first target here that triggers it.
      - name: Generate hardware config (make ig-hw-all)
        run: |
          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::giving up after $max attempts: $*"
                return 1
              fi
              echo "Attempt $attempt/$max failed - retrying with a clean .bender/ in 20s (see ci.yml's lint job bender-sources step for why)."
              rm -rf .bender
              sleep 20
              attempt=$((attempt + 1))
            done
          }
          try() { make ig-hw-all; }
          retry try

      # synth-all does NOT trigger a pickle rebuild (docs/infra-plan.md
      # Appendix B item 2) - must run explicitly before synth-all.
      - name: Pickle RTL (make pickle-all)
        run: make pickle-all

      # Monolithic synth-all, never run-yosys-hier: the hierarchical flow is
      # broken on this design (docs/infra-plan.md Appendix B item 2).
      - name: Synthesize (make synth-all)
        run: make synth-all

      # A netlist can pass `check` with 0 problems and still be unusable by
      # the backend, because OpenROAD looks a lot of things up by literal
      # name: macros.tcl places every SRAM by hierarchical instance path,
      # and basilisk_instances.sdc anchors constraints to specific cells and
      # nets. A `get_cells` glob that matches nothing is not a Tcl error, so
      # a synthesis rename degrades placement or silently drops constraints
      # instead of failing. (That is not hypothetical: `*ddr_rcv_clk_o*`
      # already matches nothing, which is why WNS reads "unavailable" - the
      # script reports it as a known warning rather than a new failure.)
      #
      # Advisory on the lane's routine runs, gating on an adoption-gate
      # dispatch (image_tag != dev), which is exactly when a tooling bump
      # could have renamed things and the run exists to catch it.
      - name: Check netlist names used by the backend scripts
        # Never gating: this check is known to be wrong (see task 4.1 in
        # openspec/changes/upgrade-yosys-upstream). It greps the YOSYS netlist
        # for the flattened instance paths macros.tcl uses, but those paths
        # only exist after OpenROAD flattens; in the yosys netlist the ~25
        # YOSYS_KEEP_HIER_INST instances are real modules with LOCAL internal
        # names. It failed adoption-gate run 35275581702 for a defect that was
        # not there, and skipped the metrics it was supposed to accompany.
        # Left in place as advisory output until it is either restricted to
        # leaf globs or moved to the OpenROAD-flattened netlist.
        continue-on-error: true
        run: |
          python3 target/ihp13/yosys/scripts/check_netlist_names.py \
            target/ihp13/yosys/out/basilisk.yosys.v \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # run-sta needs cwd target/ihp13/yosys: opensta_timings.tcl's
      # `read_sdc ../openroad/src/basilisk.sdc` is relative to the caller's
      # cwd (design.md D4). Two variables must be passed explicitly because
      # this standalone `make -f yosys.mk` call does not go through
      # iguana.mk (the include chain the ig-hw-all/pickle-all/synth-all
      # steps above run through, where these are normally set):
      #   - RTL_NAME=basilisk: without it, yosys.mk's own default
      #     (RTL_NAME=TOP_DESIGN=iguana_chip) applies and it looks for the
      #     wrong netlist entirely.
      #   - PICKLE_OUT=../pickle/out (relative to the -C cwd, i.e.
      #     target/ihp13/pickle/out): only ever defined in pickle.mk, which
      #     this standalone invocation never includes. Without it,
      #     yosys.mk's `SV2V_FILE := $(PICKLE_OUT)/$(RTL_NAME).sv2v.v` -
      #     one of run-sta's prerequisites via $(NETLIST) - resolves to the
      #     empty-PICKLE_OUT path `/basilisk.sv2v.v`, and make fails with
      #     "No rule to make target '/basilisk.sv2v.v'" before ever running
      #     the sta binary. Found via a real end-to-end run (task 3.3) that
      #     silently produced zero timing output instead of erroring loudly
      #     - task 1.2's in-container STA check never exercised this
      #     because it pointed read_sdc at a file in the same directory,
      #     not the real relative path, so this prerequisite-resolution gap
      #     went unnoticed until the actual full-chain run.
      # Captures stdout for synth_metrics.py to parse; a failure here does
      # not fail the job (design.md D4 - STA is measurement, not a
      # synth-lane gate) but IS surfaced loudly via the metrics script's
      # own warning.
      # A third, pre-existing cwd inconsistency (found via a real run, task
      # 3.3): opensta_timings.tcl's `read_sdc ../openroad/src/basilisk.sdc`
      # needs cwd target/ihp13/yosys (above), but basilisk.sdc's own
      # internal `source src/basilisk_instances.sdc` line was written for
      # cwd target/ihp13/openroad - that's how chip.tcl actually invokes it
      # (`read_sdc src/basilisk.sdc`, from openroad.mk's own directory).
      # These two cwd requirements are mutually exclusive for a single
      # process, and nothing in this repo appears to have ever exercised
      # run-sta standalone before this change to have caught it. Not fixed
      # by editing basilisk.sdc/opensta_timings.tcl (out of this change's
      # scope - the flow's own scripts are invoked as-is, see proposal.md);
      # instead, a CI-only symlink makes the existing convention
      # resolvable without changing what either script does.
      - name: Workaround - symlink basilisk_instances.sdc for run-sta's cwd
        run: ln -sf ../../openroad/src/basilisk_instances.sdc target/ihp13/yosys/src/basilisk_instances.sdc

      - name: Static timing analysis (make -C target/ihp13/yosys run-sta)
        run: |
          make -C target/ihp13/yosys -f yosys.mk run-sta RTL_NAME=basilisk PICKLE_OUT=../pickle/out | tee target/ihp13/yosys/reports/sta_output.txt || \
            echo "::warning::run-sta failed or reported no timing paths - WNS will show unavailable in the summary"

      - name: Metrics summary (cell count / area / DFF count / WNS vs baseline)
        run: |
          python3 target/ihp13/yosys/scripts/synth_metrics.py \
            --area target/ihp13/yosys/reports/basilisk_area.json \
            --check target/ihp13/yosys/reports/basilisk_synth.rpt \
            --sta target/ihp13/yosys/reports/sta_output.txt \
            --baseline target/ihp13/yosys/synth-baseline.json

      # Netlist only on a successful synth (nothing to upload otherwise).
      - name: Upload netlist
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: basilisk-netlist
          path: target/ihp13/yosys/out/basilisk.yosys.v
          retention-days: 30

      # Reports/logs always, even on failure - they're the diagnostic trail.
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synth-reports
          path: |
            target/ihp13/yosys/reports/
            target/ihp13/yosys/*.log
          retention-days: 30
          if-no-files-found: warn
