name: newt-eda image

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/newt-eda

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Needed on every run, not just main pushes: the default docker-container
      # buildx driver runs BuildKit in an isolated container that does not
      # share image storage with the local Docker daemon, so a later stage's
      # `FROM <local-tag>` can't see an earlier stage's `load: true` output -
      # it tries to resolve it as a real registry ref instead and fails. Each
      # stage below pushes to GHCR under a `:ci` working tag so the composite
      # build's FROM lines resolve for real. This assumes GITHUB_TOKEN has
      # packages:write on pull_request too, true for same-repo PRs (no
      # external contributors yet); revisit if that changes.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Each stage caches independently on GHCR so an unchanged Dockerfile is
      # a cache hit and only touched stages actually rebuild (design.md D5).
      - name: Build pickle stage
        id: pickle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/pickle
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pickle:ci
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:pickle
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:pickle,mode=max

      - name: Build yosys stage
        id: yosys
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/yosys
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-yosys:ci
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:yosys
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:yosys,mode=max

      - name: Build openroad stage
        id: openroad
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/openroad
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-openroad:ci
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:openroad
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:openroad,mode=max

      - name: Build riscv64 stage
        id: riscv64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/riscv64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-riscv64:ci
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:riscv64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:riscv64,mode=max

      - name: Build verilator stage
        id: verilator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/verilator
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-verilator:ci
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:verilator
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:verilator,mode=max

      - name: Build composite image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/all
          # Consume each stage by the DIGEST that step just pushed, never by the
          # mutable :ci tag. buildx does not re-resolve a tag it already has a
          # cached resolution for, so a :ci reference can silently resolve to a
          # previous run's image: in run 35192327059 the yosys stage pushed
          # sha256:688531e8 while the composite consumed sha256:5f4a7521, built
          # the image from the OLD yosys, and the smoke test failed against a
          # stale binary. Harmless while a stage never changed, which is why it
          # went unnoticed until the yosys upgrade. Digests also make the shared
          # :ci tag safe against two PR runs overwriting each other.
          build-args: |
            PICKLE_IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pickle@${{ steps.pickle.outputs.digest }}
            YOSYS_IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-yosys@${{ steps.yosys.outputs.digest }}
            OPENROAD_IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-openroad@${{ steps.openroad.outputs.digest }}
            RISCV64_IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-riscv64@${{ steps.riscv64.outputs.digest }}
            VERILATOR_IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-verilator@${{ steps.verilator.outputs.digest }}
          tags: newt-eda:smoke-test
          load: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:all
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:all,mode=max

      - name: Smoke test
        run: |
          docker run --rm -v "${{ github.workspace }}/docker/smoke-test.sh:/smoke-test.sh:ro" \
            newt-eda:smoke-test bash /smoke-test.sh

      # A pull request's composite image, published so it can be *run* rather
      # than only build-verified. The adoption gate for a tooling bump is a
      # synth.yml dispatch with image_tag=pr-<n> on the self-hosted runner
      # (upgrade-yosys-upstream design D5), and that runner cannot see the
      # `load: true` image above - it lives only in this runner's local Docker
      # daemon. Pushed only after the smoke test passes, and never as `:dev`,
      # so a PR can never move the tag the synth lane and developers default
      # to. The tag follows the PR head: a later push to the same PR
      # overwrites it, which is what a gate run wants (measure the latest
      # head, not whatever the PR opened with).
      - name: Publish PR image for gate runs
        if: github.event_name == 'pull_request'
        run: |
          docker tag newt-eda:smoke-test "${REGISTRY}/${IMAGE_NAME}:pr-${{ github.event.pull_request.number }}"
          docker push "${REGISTRY}/${IMAGE_NAME}:pr-${{ github.event.pull_request.number }}"

      # Publish only after the smoke test passes, and only on main (never on PRs).
      - name: Tag and publish
        if: github.event_name != 'pull_request'
        run: |
          docker tag newt-eda:smoke-test "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}"
          docker tag newt-eda:smoke-test "${REGISTRY}/${IMAGE_NAME}:dev"
          docker push "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}"
          docker push "${REGISTRY}/${IMAGE_NAME}:dev"
