name: newt-eda image

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/newt-eda

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Each stage caches independently on GHCR so an unchanged Dockerfile is
      # a cache hit and only touched stages actually rebuild (design.md D5).
      - name: Build pickle stage
        uses: docker/build-push-action@v6
        with:
          context: docker/pickle
          tags: newt-eda-pickle:dev
          load: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:pickle
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-cache:pickle,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

      - name: Build yosys stage
        uses: docker/build-push-action@v6
        with:
          context: docker/yosys
          tags: newt-eda-yosys:dev
          load: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:yosys
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-cache:yosys,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

      - name: Build openroad stage
        uses: docker/build-push-action@v6
        with:
          context: docker/openroad
          tags: newt-eda-openroad:dev
          load: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:openroad
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-cache:openroad,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

      - name: Build riscv64 stage
        uses: docker/build-push-action@v6
        with:
          context: docker/riscv64
          tags: newt-eda-riscv64:dev
          load: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:riscv64
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-cache:riscv64,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

      - name: Build verilator stage
        uses: docker/build-push-action@v6
        with:
          context: docker/verilator
          tags: newt-eda-verilator:dev
          load: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:verilator
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-cache:verilator,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

      - name: Build composite image
        uses: docker/build-push-action@v6
        with:
          context: docker/all
          build-args: |
            PICKLE_IMG=newt-eda-pickle:dev
            YOSYS_IMG=newt-eda-yosys:dev
            OPENROAD_IMG=newt-eda-openroad:dev
            RISCV64_IMG=newt-eda-riscv64:dev
            VERILATOR_IMG=newt-eda-verilator:dev
          tags: newt-eda:smoke-test
          load: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:all
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-cache:all,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

      - name: Smoke test
        run: |
          docker run --rm -v "${{ github.workspace }}/docker/smoke-test.sh:/smoke-test.sh:ro" \
            newt-eda:smoke-test bash /smoke-test.sh

      # Publish only after the smoke test passes, and only on main (never on PRs).
      - name: Tag and publish
        if: github.event_name != 'pull_request'
        run: |
          docker tag newt-eda:smoke-test "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}"
          docker tag newt-eda:smoke-test "${REGISTRY}/${IMAGE_NAME}:dev"
          docker push "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}"
          docker push "${REGISTRY}/${IMAGE_NAME}:dev"
